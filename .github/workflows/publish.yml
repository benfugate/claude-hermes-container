name: Build and Push Docker Image

# Every path to a new image ends in a push to main:
#   - Dependabot bumps the base-image digest -> ci.yml auto-merges -> push
#   - Dependabot bumps the upstream submodule -> merged by hand -> push
#   - workflow_dispatch for a manual rebuild
# No `schedule:` trigger, so there is nothing for GitHub to auto-disable.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The application lives in the `upstream/` submodule; without this the
          # Dockerfile's COPY finds an empty directory and the image ships no app.
          submodules: recursive

      - name: Record the pinned upstream revision
        id: upstream
        run: |
          cd upstream
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # metadata-action lower-cases this; GHCR rejects references with capitals.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=claude-hermes-container
            org.opencontainers.image.description=claude-hermes packaged as a container, tracking sypsyp97/claude-hermes
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dev.fugate.upstream.repository=sypsyp97/claude-hermes
            dev.fugate.upstream.revision=${{ steps.upstream.outputs.sha }}
            dev.fugate.upstream.ref=${{ steps.upstream.outputs.ref }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest
