name: Build and Push Docker Image

# Every path to a new image ends in a push to main:
#   - Dependabot bumps the base-image digest -> ci.yml auto-merges -> push
#   - Dependabot bumps the Claude Code CLI -> ci.yml auto-merges -> push
#   - Dependabot bumps the upstream submodule -> AI review -> auto-merged if safe, else by hand -> push
#   - workflow_dispatch for a manual rebuild
# No `schedule:` trigger, so there is nothing for GitHub to auto-disable.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The application lives in the `upstream/` submodule; without this the
          # Dockerfile's COPY finds an empty directory and the image ships no app.
          submodules: recursive

      - name: Record the pinned upstream revision
        id: upstream
        run: |
          cd upstream
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lower-cases this; GHCR rejects references with capitals.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=claude-hermes-container
            org.opencontainers.image.description=claude-hermes packaged as a container, tracking sypsyp97/claude-hermes
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dev.fugate.upstream.repository=sypsyp97/claude-hermes
            dev.fugate.upstream.revision=${{ steps.upstream.outputs.sha }}
            dev.fugate.upstream.ref=${{ steps.upstream.outputs.ref }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest
